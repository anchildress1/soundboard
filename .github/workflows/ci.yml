name: CI

# No path filter: `test` is a required check on main, and a path-filtered workflow never reports
# on the PRs it skips. Docs-only changes still run the job but skip the install, build, and tests.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || git diff --name-only "$BASE_SHA" HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping install, build, and tests."
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Playwright browsers
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.changes.outputs.code == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.changes.outputs.code == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Check formatting
        if: steps.changes.outputs.code == 'true'
        run: make format-check

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: make lint

      - name: Type check
        if: steps.changes.outputs.code == 'true'
        run: make typecheck

      - name: Unit tests with coverage
        if: steps.changes.outputs.code == 'true'
        run: make test

      - name: Store coverage report
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: E2E tests
        if: steps.changes.outputs.code == 'true'
        run: make e2e

      - name: Store Playwright report
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Runs on every change: docs can leak secrets too, and the scan needs no install.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fork PRs get no repository secrets; Sonar runs on same-repo PRs and manual runs.
      - name: SonarCloud scan
        if: steps.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0 # nosemgrep
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
