# Cloud Run service: one instance, one L4. The app container takes ingress; the model sidecar
# holds the GPU (Cloud Run attaches a GPU to exactly one container). Rendered by deploy.sh.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: soundboard
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        # GPUs require instance-based billing.
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
        run.googleapis.com/container-dependencies: '{"app":["model"]}'
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 3600
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
      containers:
        - name: app
          image: ${APP_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_URL
              value: http://127.0.0.1:8081
            - name: GCP_PROJECT_ID
              value: ${GCP_PROJECT_ID}
            - name: GCS_BUCKET
              value: ${GCS_BUCKET}
            - name: FLR_CHANNEL_ID
              value: ${FLR_CHANNEL_ID}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: ${GOOGLE_OAUTH_CLIENT_ID}
            - name: ALLOWLIST_EMAILS
              value: ${ALLOWLIST_EMAILS}
            - name: DEMO_EMAILS
              value: ${DEMO_EMAILS}
            - name: PUBLIC_SENTRY_DSN
              value: ${PUBLIC_SENTRY_DSN}
            # Cloud Run terminates TLS and appends the client to X-Forwarded-For; adapter-node reads
            # the origin (for the OAuth redirect) and client IP (for per-visitor caps) from these.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: host
            - name: ADDRESS_HEADER
              value: x-forwarded-for
            - name: XFF_DEPTH
              value: '1'
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: soundboard-session-secret, key: latest }
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: soundboard-oauth-client-secret, key: latest }
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef: { name: soundboard-youtube-api-key, key: latest }
          resources:
            limits:
              cpu: '2'
              memory: 8Gi
        - name: model
          image: ${MODEL_IMAGE}
          resources:
            limits:
              # The L4 minimum (4 CPU / 16 GiB) is met by the GPU container on its own.
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
          # TCP, not /health: the port opens before weights finish loading, so the page serves
          # while the app reports "waking model".
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 48
