# Cloud Run service: one app instance, no GPU. Models run on the Gemini API.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: soundboard
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/startup-cpu-boost: 'true'
    # Cloud Run rejects Kubernetes securityContext; the distroless :nonroot image runs as non-root.
    spec: # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
      serviceAccountName: ${SERVICE_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - name: app # nosemgrep: yaml.kubernetes.security.allow-privilege-escalation-no-securitycontext.allow-privilege-escalation-no-securitycontext
          image: ${APP_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: GEMINI_ANALYST_MODEL
              value: gemini-3.8-flash
            - name: GEMINI_PICK_MODEL
              value: gemini-4-argon
            - name: GCP_PROJECT_ID
              value: ${GCP_PROJECT_ID}
            - name: GCS_BUCKET
              value: ${GCS_BUCKET}
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: ${GOOGLE_OAUTH_CLIENT_ID}
            - name: SIGNUP_MODE
              value: ${SIGNUP_MODE}
            - name: KMS_KEY
              value: ${KMS_KEY}
            - name: PUBLIC_SENTRY_DSN
              value: ${PUBLIC_SENTRY_DSN}
            # Research batches arrive as Cloud Tasks deliveries signed as the runtime identity.
            - name: RESEARCH_QUEUE
              value: ${RESEARCH_QUEUE}
            - name: RESEARCH_TASK_URL
              value: ${RESEARCH_TASK_URL}
            - name: RESEARCH_TASK_SA
              value: ${SERVICE_ACCOUNT}
            # Gate G1: Gemini hears a peer's public upload by URL (specs/006-fanbase-learning/gates/g1).
            - name: PEER_HEARING
              value: '1'
            # Cloud Run terminates TLS; adapter-node reads the origin for the OAuth redirect from these.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: host
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: soundboard-session-secret, key: latest }
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: soundboard-oauth-client-secret, key: latest }
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef: { name: soundboard-youtube-api-key, key: latest }
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: soundboard-gemini-api-key, key: latest }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: DATABASE_URL, key: latest }
          resources:
            limits:
              cpu: '2'
              memory: 8Gi
