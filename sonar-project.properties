sonar.projectKey=anchildress1_soundboard
sonar.organization=anchildress1

sonar.sources=src,Dockerfile
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,**/build/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# docker:S8431 wants a tag OR a digest. Base images keep both on purpose: the digest makes the build
# immutable, and Dependabot only updates digest pins that also carry a tag.
sonar.issue.ignore.multicriteria=s8431
sonar.issue.ignore.multicriteria.s8431.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.s8431.resourceKey=Dockerfile
