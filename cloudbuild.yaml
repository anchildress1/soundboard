# Builds the app image with the Sentry token as a BuildKit secret: source maps reach Sentry under the
# commit's release, and the token never lands in an image layer. deploy.sh passes _IMAGE and _RELEASE.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ['DOCKER_BUILDKIT=1']
    secretEnv: ['SENTRY_AUTH_TOKEN']
    args:
      - -c
      - >-
        printf '%s' "$$SENTRY_AUTH_TOKEN" > /tmp/sentry_token &&
        docker build --secret id=sentry_auth_token,src=/tmp/sentry_token
        --build-arg SENTRY_RELEASE=$_RELEASE --tag $_IMAGE . &&
        rm -f /tmp/sentry_token
images: ['$_IMAGE']
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/soundboard-sentry-auth-token/versions/latest
      env: SENTRY_AUTH_TOKEN
